name: Receber MQTT da demonstracao Wokwi
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/integration/capture-request.txt'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Node-RED, painel e receptor MQTT
        run: |
          npm install --prefix node-red
          python -m pip install -r requirements.txt
      - name: Executar Node-RED e receber publicacoes reais do Wokwi
        run: python -u scripts/capture_integration.py --seconds 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coleta-wokwi-mqtt
          path: |
            integration-capture/
            node-red/package-lock.json
          if-no-files-found: warn
