name: Validar fonte, logica e painel
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes do painel e exportacao
        run: |
          node --test tests/dashboard.test.cjs
          python -m unittest discover -s tests -p 'test_*.py' -v
          node scripts/validate.cjs
      - name: Testes da logica C++ utilizada pelo firmware
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_monitor.cpp -o /tmp/test-monitor
          /tmp/test-monitor
      - name: Compilar firmware ESP32 nos dois perfis
        run: |
          python -m pip install platformio==6.1.18
          pio run -e esp32dev -e prolongado
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/firmware.elf
            .pio/build/prolongado/firmware.bin
            .pio/build/prolongado/firmware.elf
